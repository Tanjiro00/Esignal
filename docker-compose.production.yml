name: earlysignal

x-improvement-flags: &improvement-flags
  FEATURE_EARLYNESS_TIMELINE: ${FEATURE_EARLYNESS_TIMELINE:-false}
  FEATURE_SIGNAL_REVIEW_QUEUE: ${FEATURE_SIGNAL_REVIEW_QUEUE:-false}
  FEATURE_COMMENT_TOPIC_RELEVANCE: ${FEATURE_COMMENT_TOPIC_RELEVANCE:-false}
  FEATURE_DECISION_EXPERIENCE: ${FEATURE_DECISION_EXPERIENCE:-false}
  FEATURE_MICROTOPIC_CONTENT_GAP: ${FEATURE_MICROTOPIC_CONTENT_GAP:-false}
  FEATURE_FEEDBACK_EVALUATION: ${FEATURE_FEEDBACK_EVALUATION:-false}
  FEATURE_TOPIC_SNAPSHOT_BUCKETS: ${FEATURE_TOPIC_SNAPSHOT_BUCKETS:-false}
  FEATURE_CHANNEL_PROFILE_FEASIBILITY_V2: ${FEATURE_CHANNEL_PROFILE_FEASIBILITY_V2:-false}
  FEATURE_OUTCOME_SUGGESTIONS: ${FEATURE_OUTCOME_SUGGESTIONS:-false}
  FEATURE_SIGNAL_PACKAGING: ${FEATURE_SIGNAL_PACKAGING:-false}
  FEATURE_YOUTUBE_OAUTH_ANALYTICS: ${FEATURE_YOUTUBE_OAUTH_ANALYTICS:-false}
  FEATURE_QUERY_EXPANSION: ${FEATURE_QUERY_EXPANSION:-false}
  FEATURE_UX_TODAY_HOME_V1: ${FEATURE_UX_TODAY_HOME_V1:-false}
  FEATURE_UX_DECISION_CARD_V1: ${FEATURE_UX_DECISION_CARD_V1:-false}
  FEATURE_UX_SIMPLE_SCORES_V1: ${FEATURE_UX_SIMPLE_SCORES_V1:-false}
  FEATURE_UX_SIMPLIFIED_NAVIGATION_V1: ${FEATURE_UX_SIMPLIFIED_NAVIGATION_V1:-false}
  FEATURE_UX_ONBOARDING_V2: ${FEATURE_UX_ONBOARDING_V2:-false}
  FEATURE_UX_OPPORTUNITY_DETAIL_V2: ${FEATURE_UX_OPPORTUNITY_DETAIL_V2:-false}
  FEATURE_UX_BRIEF_V2: ${FEATURE_UX_BRIEF_V2:-false}
  FEATURE_UX_RESULTS_V2: ${FEATURE_UX_RESULTS_V2:-false}
  FEATURE_LLM_INTELLIGENCE: ${FEATURE_LLM_INTELLIGENCE:-false}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: earlysignal
      POSTGRES_USER: earlysignal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - earlysignal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earlysignal"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - earlysignal_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn apps.api.main:app --host 0.0.0.0 --port 8000",
      ]
    environment:
      <<: *improvement-flags
      APP_ENV: production
      DEMO_MODE: "false"
      DATABASE_URL: postgresql+psycopg://earlysignal:${POSTGRES_PASSWORD}@postgres:5432/earlysignal
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      AUTH_REQUIRED: "true"
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-earlysignal_session}
      AUTH_COOKIE_SECURE: "true"
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      AUTH_PASSWORD_ITERATIONS: ${AUTH_PASSWORD_ITERATIONS:-600000}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-10}
      AUTH_LOGIN_MAX_FAILURES: ${AUTH_LOGIN_MAX_FAILURES:-5}
      AUTH_LOGIN_BLOCK_MINUTES: ${AUTH_LOGIN_BLOCK_MINUTES:-15}
      AUTH_PEPPER: ${AUTH_PEPPER:?AUTH_PEPPER is required}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?YOUTUBE_API_KEY is required}
      YOUTUBE_OAUTH_CLIENT_ID: ${YOUTUBE_OAUTH_CLIENT_ID:-}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${YOUTUBE_OAUTH_CLIENT_SECRET:-}
      YOUTUBE_OAUTH_REDIRECT_URI: ${YOUTUBE_OAUTH_REDIRECT_URI:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_AUDITOR_MODEL: ${OPENAI_AUDITOR_MODEL:-gpt-5.6-terra}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_AUDITOR_REASONING_EFFORT: ${OPENAI_AUDITOR_REASONING_EFFORT:-medium}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-45}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-4000}
      OPENAI_RETRY_ATTEMPTS: ${OPENAI_RETRY_ATTEMPTS:-2}
      LLM_MAX_CALLS_PER_RUN: ${LLM_MAX_CALLS_PER_RUN:-24}
      LLM_MAX_RECONCILIATIONS_PER_RUN: ${LLM_MAX_RECONCILIATIONS_PER_RUN:-4}
      LLM_MAX_TOPIC_SYNTHESES_PER_RUN: ${LLM_MAX_TOPIC_SYNTHESES_PER_RUN:-8}
      LLM_MAX_CONTENT_GAP_SYNTHESES_PER_RUN: ${LLM_MAX_CONTENT_GAP_SYNTHESES_PER_RUN:-6}
      LLM_MAX_AUDITS_PER_RUN: ${LLM_MAX_AUDITS_PER_RUN:-12}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-1000000}
      LLM_RECONCILIATION_DAILY_TOKEN_SHARE: ${LLM_RECONCILIATION_DAILY_TOKEN_SHARE:-0.12}
      LLM_TOPIC_SYNTHESIS_DAILY_TOKEN_SHARE: ${LLM_TOPIC_SYNTHESIS_DAILY_TOKEN_SHARE:-0.25}
      LLM_CONTENT_GAP_DAILY_TOKEN_SHARE: ${LLM_CONTENT_GAP_DAILY_TOKEN_SHARE:-0.35}
      LLM_WORKSPACE_DAILY_TOKEN_BUDGET: ${LLM_WORKSPACE_DAILY_TOKEN_BUDGET:-250000}
      LLM_REQUIRE_GROUNDING_AUDIT: ${LLM_REQUIRE_GROUNDING_AUDIT:-true}
      LLM_CIRCUIT_FAILURE_THRESHOLD: ${LLM_CIRCUIT_FAILURE_THRESHOLD:-3}
      LLM_STALE_RUN_MINUTES: ${LLM_STALE_RUN_MINUTES:-15}
      TOPIC_PIPELINE_STALE_MINUTES: ${TOPIC_PIPELINE_STALE_MINUTES:-30}
      EVALUATION_MINIMUM_LABELS: ${EVALUATION_MINIMUM_LABELS:-50}
      RAW_PAYLOAD_DIRECTORY: /app/var/raw_payloads
      DISCOVERY_PROVIDER_PRIORITY: youtube_web,youtube_official
      METADATA_PROVIDER_PRIORITY: youtube_official
      COMMENT_PROVIDER_PRIORITY: youtube_official,youtube_web_comments
      TRANSCRIPT_PROVIDER_PRIORITY: youtube_transcript
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - earlysignal_raw_payloads:/app/var/raw_payloads
      - ${BACKUP_DIRECTORY:-./backups}:/app/var/backups:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "python",
        "-m",
        "apps.worker",
        "serve",
        "--limit",
        "5",
        "--snapshot-limit",
        "50",
        "--poll-seconds",
        "60",
      ]
    environment:
      <<: *improvement-flags
      APP_ENV: production
      DEMO_MODE: "false"
      DATABASE_URL: postgresql+psycopg://earlysignal:${POSTGRES_PASSWORD}@postgres:5432/earlysignal
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      AUTH_REQUIRED: "true"
      AUTH_COOKIE_SECURE: "true"
      AUTH_PASSWORD_ITERATIONS: ${AUTH_PASSWORD_ITERATIONS:-600000}
      AUTH_PEPPER: ${AUTH_PEPPER:?AUTH_PEPPER is required}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?YOUTUBE_API_KEY is required}
      YOUTUBE_OAUTH_CLIENT_ID: ${YOUTUBE_OAUTH_CLIENT_ID:-}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${YOUTUBE_OAUTH_CLIENT_SECRET:-}
      YOUTUBE_OAUTH_REDIRECT_URI: ${YOUTUBE_OAUTH_REDIRECT_URI:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_AUDITOR_MODEL: ${OPENAI_AUDITOR_MODEL:-gpt-5.6-terra}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_AUDITOR_REASONING_EFFORT: ${OPENAI_AUDITOR_REASONING_EFFORT:-medium}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-45}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-4000}
      OPENAI_RETRY_ATTEMPTS: ${OPENAI_RETRY_ATTEMPTS:-2}
      LLM_MAX_CALLS_PER_RUN: ${LLM_MAX_CALLS_PER_RUN:-24}
      LLM_MAX_RECONCILIATIONS_PER_RUN: ${LLM_MAX_RECONCILIATIONS_PER_RUN:-4}
      LLM_MAX_TOPIC_SYNTHESES_PER_RUN: ${LLM_MAX_TOPIC_SYNTHESES_PER_RUN:-8}
      LLM_MAX_CONTENT_GAP_SYNTHESES_PER_RUN: ${LLM_MAX_CONTENT_GAP_SYNTHESES_PER_RUN:-6}
      LLM_MAX_AUDITS_PER_RUN: ${LLM_MAX_AUDITS_PER_RUN:-12}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-1000000}
      LLM_RECONCILIATION_DAILY_TOKEN_SHARE: ${LLM_RECONCILIATION_DAILY_TOKEN_SHARE:-0.12}
      LLM_TOPIC_SYNTHESIS_DAILY_TOKEN_SHARE: ${LLM_TOPIC_SYNTHESIS_DAILY_TOKEN_SHARE:-0.25}
      LLM_CONTENT_GAP_DAILY_TOKEN_SHARE: ${LLM_CONTENT_GAP_DAILY_TOKEN_SHARE:-0.35}
      LLM_WORKSPACE_DAILY_TOKEN_BUDGET: ${LLM_WORKSPACE_DAILY_TOKEN_BUDGET:-250000}
      LLM_REQUIRE_GROUNDING_AUDIT: ${LLM_REQUIRE_GROUNDING_AUDIT:-true}
      LLM_CIRCUIT_FAILURE_THRESHOLD: ${LLM_CIRCUIT_FAILURE_THRESHOLD:-3}
      LLM_STALE_RUN_MINUTES: ${LLM_STALE_RUN_MINUTES:-15}
      TOPIC_PIPELINE_STALE_MINUTES: ${TOPIC_PIPELINE_STALE_MINUTES:-30}
      EVALUATION_MINIMUM_LABELS: ${EVALUATION_MINIMUM_LABELS:-50}
      RAW_PAYLOAD_DIRECTORY: /app/var/raw_payloads
      DISCOVERY_PROVIDER_PRIORITY: youtube_web,youtube_official
      METADATA_PROVIDER_PRIORITY: youtube_official
      COMMENT_PROVIDER_PRIORITY: youtube_official,youtube_web_comments
      TRANSCRIPT_PROVIDER_PRIORITY: youtube_transcript
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - earlysignal_raw_payloads:/app/var/raw_payloads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  earlysignal_postgres:
  earlysignal_redis:
  earlysignal_raw_payloads:
