[project]
name = "earlysignal"
version = "0.1.0"
description = "Evidence-backed YouTube creator trend intelligence MVP"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<46",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
  "youtube-comment-downloader>=0.1.78,<0.2",
  "youtube-transcript-api>=1.2.4,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
evaluation = [
    "numpy>=2.2,<3",
    "scikit-learn>=1.7,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["apps/api", "packages"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "es_core", "packages"]
